services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pcd
      POSTGRES_DB: pcd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcd -d pcd"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pcd:${POSTGRES_PASSWORD}@db:5432/pcd
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
